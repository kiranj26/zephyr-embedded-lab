# App-level Kconfig: what this app needs on ANY board.
# (Board-specific choices, like the random source, live in boards/esp32s3_devkitc.conf.)

# Own module from workspace/modules/greeting (found via ZEPHYR_EXTRA_MODULES in CMakeLists.txt)
CONFIG_GREETING=y
# int, range 1..10 (defined in the module's Kconfig). Out-of-range values stop the build.
CONFIG_GREETING_REPEAT=3

# Float formatting for printk/printf ("%.3f"); without it, floats print as "*float*".
# With picolibc, printk is built on picolibc's vfprintf, so this also switches picolibc
# from PICOLIBC_IO_LONG_LONG (integer-only) to PICOLIBC_IO_FLOAT. Cost: +828 B of flash.
# CONFIG_FPU is not needed: it speeds up float *math*, it doesn't add *printing*.
CONFIG_CBPRINTF_FP_SUPPORT=y
