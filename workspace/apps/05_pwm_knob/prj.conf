# Lesson 5 Kconfig.
# Two-switch rule: the devicetree enables the hardware (status = "okay"),
# these enable the subsystems that build the drivers.

# ADC subsystem; ADC_ESP32 defaults on because &adc0 is okay
CONFIG_ADC=y

# PWM subsystem; PWM_LED_ESP32 (LEDC) defaults on because &ledc0 is okay
CONFIG_PWM=y
