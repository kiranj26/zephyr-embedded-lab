# Board-specific Kconfig for esp32s3_devkitc (passed as EXTRA_CONF_FILE by scripts/build.sh)
# Merged after prj.conf, so it wins on conflicts.

# Random source: the ESP32-S3 hardware TRNG (devicetree trng0, status "okay").
# This one switch is all that's needed: ENTROPY_ESP32_RNG turns on by default and
# selects ENTROPY_HAS_DRIVER, so both random generator choices default to the hardware.
CONFIG_ENTROPY_GENERATOR=y

# Alternative used by the course demo: a fake, timer-based generator for testing only
# (prints a "not truly random" CMake warning). Only TEST_RANDOM_GENERATOR is actually
# chosen; the other three lines follow from it.
# CONFIG_TEST_RANDOM_GENERATOR=y
# CONFIG_TIMER_RANDOM_GENERATOR=y
# CONFIG_TEST_CSPRNG_GENERATOR=y
# CONFIG_STACK_POINTER_RANDOM=0

