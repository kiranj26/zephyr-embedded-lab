# App-level Kconfig: what this app needs on ANY board.
# (Board-specific choices, like the random source, live in boards/esp32s3_devkitc.conf.)

# Own module from workspace/modules/greeting (found via ZEPHYR_EXTRA_MODULES in CMakeLists.txt)
CONFIG_GREETING=y
# int, range 1..10 (defined in the module's Kconfig). Out-of-range values stop the build.
CONFIG_GREETING_REPEAT=3
